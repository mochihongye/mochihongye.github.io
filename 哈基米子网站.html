<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>年糕相册 - 哈基米小窝</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --secondary-color: #ec4899;
            --secondary-light: #f472b6;
            --accent-green: #22c55e;
            --accent-yellow: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #fdf4ff 100%);
            --card-shadow: 0 4px 20px rgba(99, 102, 241, 0.1);
            --card-hover-shadow: 0 8px 30px rgba(99, 102, 241, 0.2);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; 
            background: var(--bg-gradient);
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px 25px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 30px rgba(99, 102, 241, 0.3);
        }
        .sidebar .logo {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .sidebar .nav-links {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar .nav-links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255,255,255,0.08);
        }
        .sidebar .nav-links a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(8px);
        }
        .sidebar .nav-links a.active {
            background: rgba(255,255,255,0.25);
            font-weight: 600;
            transform: translateX(12px);
            box-shadow: 4px 4px 15px rgba(0,0,0,0.2);
            border-radius: 14px 20px 20px 14px;
        }
        .sidebar .nav-links a .icon {
            font-size: 18px;
        }
        .sidebar .level-box {
            padding: 18px;
            background: rgba(255,255,255,0.1);
            border-radius: 14px;
            margin-top: auto;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .top-nav {
            display: none;
        }

        .banner {
            width: calc(100% - 260px);
            height: 420px;
            background: linear-gradient(135deg, #8BC34A 0%, #FF80AB 50%, #2196F3 100%);
            display: flex;
            align-items: center;
            margin-left: 260px;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            margin-bottom: 40px;
        }
        .banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
        .banner-content {
            position: relative;
            z-index: 1;
        }

        .container {
            margin-left: 280px;
            padding: 0 40px 110px;
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .photo-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: var(--card-shadow);
        }
        .photo-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-hover-shadow);
        }
        .photo-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .photo-item.video::before {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            z-index: 10;
        }
        .photo-item.video:hover::before {
            background: rgba(99, 102, 241, 0.9);
            transform: translate(-50%, -50%) scale(1.1);
        }
        .photo-item.video img {
            filter: brightness(0.8);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            position: relative;
            max-width: 95%;
            max-height: 95%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-content img,
        .modal-content video {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .modal-close {
            position: absolute;
            top: -50px;
            right: 0;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 10px;
        }
        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 32px;
            padding: 15px 20px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }
        .modal-nav:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-50%) scale(1.1);
        }
        .modal-nav.prev {
            left: -70px;
        }
        .modal-nav.next {
            right: -70px;
        }
        .modal-indicator {
            position: absolute;
            bottom: -40px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        body.dark {
            background: linear-gradient(135deg, #0f0d24 0%, #1a163a 50%, #0f0d24 100%);
            color: #e0e0e0;
        }
        body.dark .sidebar {
            background: linear-gradient(180deg, #312e81 0%, #1e1b4b 100%);
        }
        body.dark .sidebar .nav-links a {
            background: rgba(255,255,255,0.08);
        }
        body.dark .sidebar .nav-links a:hover {
            background: rgba(255,255,255,0.15);
        }
        body.dark .photo-item {
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        body.dark .section-title {
            color: #ffffff;
        }

        /* 主题切换 + 音乐播放器 */
        .control-bar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 15px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .control-bar .theme-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 25px;
            transition: all 0.3s;
        }
        .control-bar .theme-btn:hover {
            background: rgba(99, 102, 241, 0.1);
        }
        body.dark .control-bar {
            background: rgba(20, 18, 45, 0.95);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        body.dark .control-bar .divider {
            background: rgba(255,255,255,0.15);
        }
        body.dark .control-bar .music-info {
            color: #ffffff;
        }
        body.dark .control-bar .theme-btn:hover {
            background: rgba(255,255,255,0.15);
        }
        .control-bar .divider {
            width: 1px;
            height: 30px;
            background: rgba(0,0,0,0.1);
        }
        .control-bar .music-info {
            font-size: 14px;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #374151;
        }
        .control-bar .music-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .control-bar .music-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }
        
        /* 响应式设计 */
        @media (max-width: 992px) {
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .sidebar .nav-links a span:last-child,
            .sidebar .logo {
                display: none;
            }
            .main-content {
                margin-left: 60px;
            }
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .sidebar {
                width: 50px;
            }
            .main-content {
                margin-left: 50px;
            }
            .photo-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">🐱 哈基米小窝</div>
    <div class="nav-links">
        <a href="index-main.html">
            <span class="icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="哈基米介绍.html">
            <span class="icon">📋</span>
            <span>年糕档案</span>
        </a>
        <a href="哈基米子网站.html" class="active">
            <span class="icon">📸</span>
            <span>年糕相册</span>
        </a>
        <a href="哈基米互动.html">
            <span class="icon">🎮</span>
            <span>互动专区</span>
        </a>
        <a href="game.html">
            <span class="icon">🎯</span>
            <span>小游戏中心</span>
        </a>
        <a href="admin.html" id="adminLink" style="display:none;">
            <span class="icon">⚙️</span>
            <span>后台管理</span>
        </a>
        <a href="index.html" id="loginOut">
            <span class="icon">🔑</span>
            <span>登录</span>
        </a>
    </div>
    <div class="level-box" id="levelBox"></div>
</div>

<div class="banner">
    <div class="banner-content">📸 年糕相册</div>
</div>

<div class="container">
    <div class="section-title">📷 照片合集</div>
    <div class="photo-grid" id="photoGrid">
    </div>

    <div class="section-title">🎬 精彩视频</div>
    <div class="photo-grid" id="videoGrid">
    </div>
</div>

<div class="control-bar" id="controlBar">
    <button class="theme-btn" id="themeToggle">🌙</button>
    <div class="divider"></div>
    <button class="music-btn" id="prevMusic">⏮</button>
    <button class="music-btn" id="toggleMusic">▶️</button>
    <button class="music-btn" id="nextMusic">⏭</button>
    <div class="music-info" id="musicInfo">歌曲 1</div>
    <audio id="bgmAudio" preload="auto"></audio>
</div>

<div class="modal" id="mediaModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">✕</span>
        <button class="modal-nav prev" onclick="prevMedia()">◀</button>
        <div id="modalMedia"></div>
        <button class="modal-nav next" onclick="nextMedia()">▶</button>
        <div class="modal-indicator" id="modalIndicator">1 / 1</div>
    </div>
</div>

<script>
    const isDark = localStorage.getItem('darkTheme') === 'true';
    if (isDark) {
        document.body.classList.add('dark');
        document.getElementById('themeToggle').innerText = '☀️';
    }

    document.getElementById('themeToggle').onclick = () => {
        document.body.classList.toggle('dark');
        const isDarkNow = document.body.classList.contains('dark');
        localStorage.setItem('darkTheme', isDarkNow);
        document.getElementById('themeToggle').innerText = isDarkNow ? '☀️' : '🌙';
    };

    // ======================
    // 音乐播放器
    // ======================
    const musicList = [
        { name: '歌曲 1', src: '音乐/song1.mp3' },
        { name: '歌曲 2', src: '音乐/song2.mp3' }
    ];
    
    let currentMusicIndex = 0;
    let isPlaying = false;
    const bgmAudio = document.getElementById('bgmAudio');

    function loadMusic(index) {
        bgmAudio.src = musicList[index].src;
        document.getElementById('musicInfo').innerText = musicList[index].name;
    }

    loadMusic(0);

    document.getElementById('toggleMusic').onclick = () => {
        const btn = document.getElementById('toggleMusic');
        if (isPlaying) {
            btn.innerText = '▶️';
            isPlaying = false;
            bgmAudio.pause();
        } else {
            btn.innerText = '⏸️';
            isPlaying = true;
            bgmAudio.play();
        }
    };

    document.getElementById('prevMusic').onclick = () => {
        currentMusicIndex = (currentMusicIndex - 1 + musicList.length) % musicList.length;
        loadMusic(currentMusicIndex);
        if (isPlaying) bgmAudio.play();
    };

    document.getElementById('nextMusic').onclick = () => {
        currentMusicIndex = (currentMusicIndex + 1) % musicList.length;
        loadMusic(currentMusicIndex);
        if (isPlaying) bgmAudio.play();
    };

    const photos = [];
    for (let i = 0; i < 26; i++) {
        photos.push({ type: 'image', src: '年糕相册/' + String.fromCharCode(97 + i) + '.jpg' });
    }

    const videos = [];
    for (let i = 1; i <= 5; i++) {
        const filename = i === 1 ? 'miao.mp4' : 'miao' + i + '.mp4';
        videos.push({ type: 'video', src: '年糕相册/' + filename, thumbnail: '年糕相册/a.jpg' });
    }

    const allMedia = [...photos, ...videos];
    let currentIndex = 0;

    function renderPhotos() {
        const grid = document.getElementById('photoGrid');
        photos.forEach((photo, index) => {
            const item = document.createElement('div');
            item.className = 'photo-item';
            item.innerHTML = `<img src="${photo.src}" alt="照片${index + 1}">`;
            item.onclick = () => openMedia(index);
            grid.appendChild(item);
        });
    }

    function renderVideos() {
        const grid = document.getElementById('videoGrid');
        videos.forEach((video, index) => {
            const item = document.createElement('div');
            item.className = 'photo-item video';
            item.innerHTML = `<img src="${video.thumbnail}" alt="视频${index + 1}">`;
            item.onclick = () => openMedia(photos.length + index);
            grid.appendChild(item);
        });
    }

    function openMedia(index) {
        currentIndex = index;
        const media = allMedia[index];
        const modalMedia = document.getElementById('modalMedia');
        
        if (media.type === 'image') {
            modalMedia.innerHTML = `<img src="${media.src}" alt="照片">`;
        } else {
            modalMedia.innerHTML = `<video src="${media.src}" controls autoplay style="max-width:100%;max-height:85vh;border-radius:16px;"></video>`;
        }
        
        document.getElementById('mediaModal').classList.add('active');
        updateIndicator();
    }

    function closeModal() {
        document.getElementById('mediaModal').classList.remove('active');
        const modalMedia = document.getElementById('modalMedia');
        const video = modalMedia.querySelector('video');
        if (video) video.pause();
    }

    function prevMedia() {
        const video = document.querySelector('#modalMedia video');
        if (video) video.pause();
        
        currentIndex = (currentIndex - 1 + allMedia.length) % allMedia.length;
        openMedia(currentIndex);
    }

    function nextMedia() {
        const video = document.querySelector('#modalMedia video');
        if (video) video.pause();
        
        currentIndex = (currentIndex + 1) % allMedia.length;
        openMedia(currentIndex);
    }

    function updateIndicator() {
        document.getElementById('modalIndicator').innerText = `${currentIndex + 1} / ${allMedia.length}`;
    }

    document.getElementById('mediaModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('mediaModal')) {
            closeModal();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (!document.getElementById('mediaModal').classList.contains('active')) return;
        if (e.key === 'ArrowLeft') prevMedia();
        if (e.key === 'ArrowRight') nextMedia();
        if (e.key === 'Escape') closeModal();
    });

    function getLevelIcon(lv) {
        if(lv>=8) return '👑皇冠';
        if(lv>=4) return '🌙月亮';
        return '⭐星星';
    }
    function getLevelName(lv) {
        if(lv>=8) return '铲屎官之神';
        if(lv>=6) return '资深铲屎官';
        if(lv>=4) return '资深铲屎官';
        if(lv>=2) return '新手铲屎官';
        return '见习铲屎官';
    }

    function getUserData(username) {
        const key = 'userData_' + username;
        const data = localStorage.getItem(key);
        if (!data) return null;
        try {
            return JSON.parse(data);
        } catch (e) {
            return null;
        }
    }

    async function updateLevelDisplay() {
        const user = localStorage.getItem('user') || '';
        let level = 0;
        let fish = 0;

        if (user) {
            const userData = getUserData(user);
            if (userData) {
                level = userData.level || 0;
                fish = userData.fish || 0;
            }

            try {
                const API_BASE = '/api';
                const res = await fetch(`${API_BASE}/user/${user}`);
                if (res.ok) {
                    const apiData = await res.json();
                    if (apiData.level !== undefined && apiData.fish !== undefined) {
                        if (apiData.level !== level || apiData.fish !== fish) {
                            level = apiData.level;
                            fish = apiData.fish;
                            const userData = { level, exp: apiData.exp || 0, fish };
                            localStorage.setItem('userData_' + user, JSON.stringify(userData));
                            localStorage.setItem('userStats', JSON.stringify(userData));
                        }
                    }
                }
            } catch (e) {}

            const levelIcon = getLevelIcon(level);
            const levelName = getLevelName(level);
            document.getElementById('levelBox').innerText =
                `${user} ${levelIcon}${levelName} Lv${level} 🐟${fish}`;
        } else {
            document.getElementById('levelBox').innerText = `游客`;
        }
    }

    function updateTopNav() {
        const user = localStorage.getItem('user');
        const link = document.getElementById('loginOut');
        if (user) {
            link.innerHTML = '<span class="icon">🚪</span><span>退出</span>';
            link.onclick = () => {
                localStorage.removeItem('user');
                localStorage.removeItem('is_admin');
                location.reload();
            };
        } else {
            link.innerHTML = '<span class="icon">🔑</span><span>登录</span>';
            link.onclick = null;
        }
    }

    function checkAdminLink() {
        const isAdmin = localStorage.getItem('is_admin') === 'true';
        const adminLink = document.getElementById('adminLink');
        if (isAdmin) {
            adminLink.style.display = 'flex';
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        // 初始化日夜模式
        const isDark = localStorage.getItem('darkTheme') === 'true';
        if (isDark) {
            document.body.classList.add('dark');
        }
        
        // 监听其他页面的状态变化
        window.addEventListener('storage', (e) => {
            if (e.key === 'darkTheme') {
                const isDark = localStorage.getItem('darkTheme') === 'true';
                document.body.classList.toggle('dark', isDark);
                document.getElementById('themeToggle').innerText = isDark ? '☀️' : '🌙';
            }
            if (e.key === 'user' || e.key === 'userStats' || e.key === 'is_admin') {
                updateLevelDisplay();
                checkAdminLink();
            }
        });
        
        renderPhotos();
        renderVideos();
        await updateLevelDisplay();
        updateTopNav();
        checkAdminLink();
    });
</script>
</body>
</html>
